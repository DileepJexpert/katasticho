spring:
  application:
    name: katixo-erp

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:katasticho}
    username: ${DB_USER:katasticho}
    password: ${DB_PASSWORD:katasticho}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Boot's 1MB default rejected every real-world upload: 100k-row drug-master
  # CSVs (~15MB), Tally Day Book XMLs, POD/HR photo attachments.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:51025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Application configuration
# Attachment file bodies. 'local' writes under storage-path (single-instance
# only); switch to 's3' (AWS or MinIO) BEFORE running a second app replica —
# uploads on local disk are invisible to other replicas and vanish with the
# container.
#   app.attachment.storage: s3
#   app.attachment.s3.bucket: katasticho-attachments
#   app.attachment.s3.region: ap-south-1
#   app.attachment.s3.endpoint: http://minio:9000   # MinIO only
#   app.attachment.s3.access-key: ...
#   app.attachment.s3.secret-key: ...
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY:1440}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY:30}
    platform-admin-secret: ${JWT_PLATFORM_ADMIN_SECRET}
    platform-admin-expiry-hours: 4
  web-session:
    # Production must configure the public React origin; blank fails closed.
    allowed-origins: ${WEB_SESSION_ALLOWED_ORIGINS:}
    cookie:
      # Production runs on HTTPS. Local overrides this because browsers reject
      # Secure cookies over plain http://localhost.
      secure: ${WEB_SESSION_COOKIE_SECURE:true}
  otp:
    expiry-minutes: 5
    max-attempts: 5
    lockout-minutes: 30
  platform-admin:
    phone: ${PLATFORM_ADMIN_PHONE:}
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
  # Fixed QA login for manual testing / bug-fixing. Seeds ONE org + OWNER with
  # every module enabled on first boot; idempotent (skips if the phone exists);
  # never touches real signups. Disabled by default — set TEST_ACCOUNT_ENABLED=true
  # in a dev/test environment only. Do NOT enable in production (known password).
  test-account:
    enabled: ${TEST_ACCOUNT_ENABLED:false}
    phone: ${TEST_ACCOUNT_PHONE:9000000001}
    password: ${TEST_ACCOUNT_PASSWORD:Test@12345}
    full-name: ${TEST_ACCOUNT_FULL_NAME:Test QA Owner}
    org-name: ${TEST_ACCOUNT_ORG_NAME:Test QA Company}
    business-type: ${TEST_ACCOUNT_BUSINESS_TYPE:DISTRIBUTOR}
    country-code: ${TEST_ACCOUNT_COUNTRY:IN}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:1000}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:20}
    ai-requests-per-minute: ${RATE_LIMIT_AI_REQUESTS_PER_MINUTE:10}
  cors:
    # Secure by default: a missing env var fails CLOSED (uses allowed-origins), not
    # OPEN (wildcard). Local dev sets CORS_DEV_MODE=true to allow all origins.
    dev-mode: ${CORS_DEV_MODE:false}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
  billing:
    # Keep disabled while the product is in build/free-beta mode so every
    # signup can explore all modules. Turn on for SaaS plan enforcement.
    enforcement-enabled: ${BILLING_ENFORCEMENT_ENABLED:false}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-4-20250514
    max-tokens: 4096
    max-sql-rows: 100
    use-local: ${AI_USE_LOCAL:true}
    default-provider: ${AI_DEFAULT_PROVIDER:OLLAMA}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:llava}
  mail:
    from: ${MAIL_FROM:noreply@katixo.com}
    from-name: ${MAIL_FROM_NAME:Katixo}
  base-url: ${APP_BASE_URL:https://app.katixo.com}
  platform-admin-url: ${PLATFORM_ADMIN_URL:https://app.katixo.com/platform-admin}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

app:
  platform-admin:
    # Local dev convenience only. Override with env vars any time and
    # remove/change these defaults before production rollout.
    email: ${PLATFORM_ADMIN_EMAIL:admin@katixo.com}
    password: ${PLATFORM_ADMIN_PASSWORD:Admin@123}

  demo:
    # "Log in without registering" mode — provisions a fully-bootstrapped demo
    # org + 8 demo users (one per role) on first boot. See
    # com.katasticho.erp.demo.DemoSeederProperties.
    #
    # Off by default. ALSO gated by @Profile("!prod") on every seeder, so an
    # accidental DEMO_ENABLED=true on a prod build is inert.
    enabled: ${DEMO_ENABLED:false}
    org-name: ${DEMO_ORG_NAME:Demo Distributor}
    business-type: ${DEMO_BUSINESS_TYPE:DISTRIBUTOR}
    industry-code: ${DEMO_INDUSTRY_CODE:FMCG_DISTRIBUTOR}
    owner-phone: ${DEMO_OWNER_PHONE:9000000001}
    # ≥ 8 chars to satisfy RegisterRequest's @Size on password.
    shared-password: ${DEMO_PASSWORD:Demo@1234}

logging:
  level:
    com.katasticho.erp: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.katasticho.erp: INFO
    org.springframework.security: WARN

server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
