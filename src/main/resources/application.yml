spring:
  application:
    name: katixo-erp

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${DB_NAME:katasticho}
    username: ${DB_USER:katasticho}
    password: ${DB_PASSWORD:katasticho}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:51025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Application configuration
app:
  jwt:
    secret: ${JWT_SECRET:katixo-dev-secret-key-change-in-production-must-be-at-least-256-bits}
    access-token-expiry-minutes: ${JWT_ACCESS_EXPIRY:1440}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY:30}
    platform-admin-secret: ${JWT_PLATFORM_ADMIN_SECRET:platform_admin_secret_at_least_256_bits_long_for_hs256_algorithm}
    platform-admin-expiry-hours: 4
  otp:
    expiry-minutes: 5
    max-attempts: 5
    lockout-minutes: 30
  platform-admin:
    phone: ${PLATFORM_ADMIN_PHONE:}
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:1000}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:20}
    ai-requests-per-minute: ${RATE_LIMIT_AI_REQUESTS_PER_MINUTE:10}
  cors:
    dev-mode: ${CORS_DEV_MODE:true}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
  billing:
    # Keep disabled while the product is in build/free-beta mode so every
    # signup can explore all modules. Turn on for SaaS plan enforcement.
    enforcement-enabled: ${BILLING_ENFORCEMENT_ENABLED:false}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-sonnet-4-20250514
    max-tokens: 4096
    max-sql-rows: 100
    default-provider: ${AI_DEFAULT_PROVIDER:OLLAMA}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:llava}
  mail:
    from: ${MAIL_FROM:noreply@katixo.com}
    from-name: ${MAIL_FROM_NAME:Katixo}
  base-url: ${APP_BASE_URL:https://app.katixo.com}
  platform-admin-url: ${PLATFORM_ADMIN_URL:https://app.katixo.com/platform-admin}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: true

logging:
  level:
    com.katasticho.erp: DEBUG
    org.springframework.security: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.katasticho.erp: INFO
    org.springframework.security: WARN

server:
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
